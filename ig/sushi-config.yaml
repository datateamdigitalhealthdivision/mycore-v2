id: my.moh.kkmhub.myehr.core
canonical: https://myehr.kkmhub.moh.gov.my/fhir/my-core
name: MYCoreImplementationGuide
title: Malaysian National MY Core Implementation Guide
description: National baseline FHIR R4 implementation guide for Malaysia. Version 2.1 is scoped to three use cases — ADT notes, laboratory reports including the EMR to LIS integration, and radiology reports including the EMR to RIS/PACS integration — and publishes the national terminology those use cases bind to.
