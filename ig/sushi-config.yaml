      - CodeSystem/pathology-local-code-my-core
      - CodeSystem/pathology-orderable-my-core
      - CodeSystem/pathology-panel-my-core
      - CodeSystem/smrp-workload-my-core
      - ConceptMap/pathology-orderable-to-local-code
      - ConceptMap/pathology-orderable-to-loinc
  PathologyCataloguePanels:
