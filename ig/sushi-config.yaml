dependencies:
  # Pinned to the versions in the local package cache. Without explicit pins SUSHI
  # asks the package registry for '#latest' on every run, which hangs when egress to
  # packages.fhir.org is blocked. Pinning is also correct IG practice: it makes the
  # build reproducible instead of drifting with whatever the registry serves.
  hl7.terminology.r4: 7.1.0
  hl7.fhir.uv.extensions.r4: 5.2.0
  hl7.fhir.uv.tools.r4: 1.1.2

groups:
  PathologyCatalogueCore:
    name: Malaysian Pathology Catalogue - core
    description: >-
      The national orderable test and panel code systems, the interim local codes, the workload categories, and the concept maps to LOINC.
