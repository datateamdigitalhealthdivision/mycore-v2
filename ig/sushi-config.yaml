parameters:
  path-resource:
    # Migration output. Wiped and regenerated by scripts/migrate-legacy-assets.py
    # on every build -- never place authored content here.
    - input/resources-legacy-migrated
    # Owned/authored terminology (Malaysian Pathology Catalogue, TermX-published
    # content). Never touched by the migration script. See its README.
    - input/resources-managed
  special-url-base:
