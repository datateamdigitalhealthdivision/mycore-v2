name: Publish Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ig
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: gem install bundler jekyll

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Build implementation guide
        run: ./scripts/build.sh

      # package-list.json is the file implementers (and the HL7 tooling) read
      # to discover which versions of this IG exist and what state each is in.
      # It is NOT produced by the IG Publisher and nothing else copied it, so
      # it has been 404 on the published site -- which means the withdrawal of
      # 2.1.0 was recorded in the repository where no consumer could see it.
      # Verified 404 on 2026-10-06 while 2.1.1 itself was serving correctly.
      - name: Publish package-list.json
        run: |
          test -f package-list.json
          python3 -c "import json,sys; json.load(open('package-list.json'))"
          cp package-list.json output/package-list.json
          echo "published package-list.json:"
          python3 -c "
          import json
          d = json.load(open('output/package-list.json'))
          for v in d['list']:
              print('  %-9s %-10s current=%s' % (v.get('version'), v.get('status'), v.get('current')))
          "

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ig/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
