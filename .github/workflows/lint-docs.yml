name: Lint Docs

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "annexes/**"
      - "tests/**"

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PINNED on purpose. The previous step used the floating action tag, so
      # markdownlint v0.40 adding rule MD060 turned 228 pre-existing table
      # cells into errors and Lint Docs went red on every branch from
      # 2026-09-17 without a single document changing. A lint job that is
      # permanently red teaches people to ignore CI.
      #
      # Pinning means a linter upgrade is a deliberate, reviewable change:
      # bump the version here, run it, and deal with whatever new rules say.
      # Rule configuration and the reasoning behind each exclusion live in
      # .markdownlint.jsonc.
      - name: Lint markdown
        run: |
          npx --yes markdownlint-cli2@0.22.1 \
            "README.md" \
            "docs/**/*.md" \
            "annexes/**/*.md" \
            "tests/**/*.md"
