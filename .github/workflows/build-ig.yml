name: Build IG

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ig
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: gem install bundler jekyll

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Validate FSH and page sync
        run: ./scripts/validate.sh

      - name: Build implementation guide
        run: ./scripts/build.sh

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: my-core-ig-build
          path: |
            ig/output
            ig/fsh-generated/resources
          if-no-files-found: error
          retention-days: 30

      - name: Cache validator
        uses: actions/cache@v6
        with:
          path: tests/.validator
          key: validator-${{ hashFiles('tests/validator.version') }}

      - name: Unit-test the conformance runner
        working-directory: tests
        run: python3 -m unittest discover -s runner -t .

      - name: Run conformance tests
        working-directory: .
        run: python3 tests/run-tests.py

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: |
            tests/report.json
            tests/validator.log
          if-no-files-found: ignore
          retention-days: 30
